<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿幫｜Agent 互動模型原型</title>
<!--
  Agent 互動模型原型（股市、發票）：左邊是問阿幫的對話，右邊即時顯示事件流、模型看得到的內容（歷史＋卡片脈絡）、命中的規則。
  資料是 core/data/demo/ 的真實片段（2026-11-19）；規則照 core/agent/demo-intent.js 與 guardrails.js 簡化。
  原型專用：步驟間的等待只為了看清楚順序，正式實作由真實事件驅動、不加延遲（ADR-0009）。不可被 import。
-->
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#14201d;--muted:#5f6f6b;--faint:#97a5a1;--line:#e3e8e6;
  --brand:#0f766e;--brand-soft:#e3f2ef;--fare:#7c3aed;--fare-soft:#efeafe;--ok:#15803d;--ok-soft:#e6f4ea;
  --warn:#b45309;--warn-soft:#fdf1e3;--bad:#b91c1c;--bad-soft:#fde8e8;--code:#f1f4f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,input{font:inherit}
.top{max-width:1100px;margin:0 auto;padding:16px 16px 8px}
.top h1{font-size:20px;margin:0 0 2px}.top p{margin:0;color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--brand);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.chip:hover{border-color:var(--brand)}.chip b{color:var(--brand);margin-right:4px}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:13px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 24px;display:grid;grid-template-columns:420px 1fr;gap:16px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}
/* 左：對話 */
.phone{background:var(--bg);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;height:min(78vh,760px);background:#f8faf9}
.phone header .av{width:34px;height:34px}.phone header .av svg{width:34px;height:34px}
.phone header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.phone header b{font-size:16px}.phone header small{color:var(--muted);font-size:12px;display:block}
.mode-tag{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.mode-tag.model{background:var(--fare-soft);color:var(--fare)}
.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.u{align-self:flex-end;background:var(--brand);color:#fff;padding:8px 12px;border-radius:16px 16px 4px 16px;max-width:85%}
.note{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.row{display:flex;gap:8px;align-items:flex-start;animation:in .25s ease both}
.av{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:var(--fare)}
.av svg{width:18px;height:18px}.av.mascot{background:none}.av.mascot svg{width:32px;height:32px}
.av.r-地點,.av.r-天氣,.av.r-空品{background:#1d4ed8}.av.r-路況{background:#475569}.av.r-行程,.av.r-公車{background:var(--brand)}
.at{font-weight:700;color:var(--fare);background:var(--fare-soft);border-radius:6px;padding:0 5px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:7px 11px;font-size:14px;max-width:92%}
.tool .who{font-size:12px;color:var(--muted)}
.say{background:var(--brand-soft);border-radius:4px 14px 14px 14px;padding:9px 12px;max-width:92%}
.say.guarded{outline:2px dashed var(--warn)}
.sys{align-self:center;font-size:12px;color:var(--faint)}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--card)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.btn{border:0;background:var(--brand);color:#fff;border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.alt{background:var(--brand-soft);color:var(--brand)}
/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:14px}
.card h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.badge{font-size:11px;font-weight:400;color:var(--muted);background:var(--code);border-radius:999px;padding:1px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.stat{background:#f4f6f5;border-radius:10px;padding:6px 8px}.stat small{color:var(--muted);display:block;font-size:12px}
.stat strong{font-size:18px;font-variant-numeric:tabular-nums;display:block}
.chg{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}.up{color:var(--bad)}.down{color:var(--ok)}.flat{color:var(--muted)}
.stk{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.stk small{color:var(--muted)}.stk .px{text-align:right;white-space:nowrap}.stk .px strong{font-size:18px;display:block}
.alt-btn{border:0;background:none;color:var(--brand);text-decoration:underline;cursor:pointer;padding:0 3px;font-size:13px}
.cform{display:flex;gap:6px;margin-top:8px}.cform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:13.5px}
.foot{color:var(--muted);font-size:12px;margin:8px 0 0}
.inv{display:grid;grid-template-columns:52px 1fr;gap:2px 8px;padding:5px 0;border-top:1px solid var(--line)}
.inv strong{letter-spacing:1px;font-variant-numeric:tabular-nums}
.win{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:6px 10px;font-weight:700;margin-bottom:6px}
.wallet{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13.5px}
.st{font-size:12px;border-radius:999px;padding:1px 8px;background:var(--brand-soft);color:var(--brand)}.st.won{background:#fff1d6;color:#8a4b00;font-weight:700}.st.lost{background:var(--code);color:var(--muted)}
/* 右：互動模型面板 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--brand);border-color:var(--brand);font-weight:700}
.pane{padding:12px;max-height:min(70vh,700px);overflow-y:auto;font-size:13.5px}
.ev{display:grid;grid-template-columns:118px 1fr;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);animation:in .25s ease both}
.ev code{font-size:12px}
.type{font:600 12px ui-monospace,Menlo,monospace;border-radius:6px;padding:1px 6px;align-self:start;justify-self:start}
.t-status,.t-done{background:var(--code);color:var(--muted)}.t-agent_note{background:var(--fare-soft);color:var(--fare)}
.t-tool_start,.t-tool_result{background:var(--brand-soft);color:var(--brand)}.t-guardrail{background:var(--warn-soft);color:var(--warn)}
.t-text{background:var(--ok-soft);color:var(--ok)}.t-client{background:#e6f1fb;color:#1d4ed8}
.turnsep{margin:10px 0 2px;font-size:12px;color:var(--faint)}
pre{background:var(--code);border-radius:10px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;font-size:12px;margin:6px 0}
.rule{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.rule h4{margin:0 0 4px;font-size:14px}.rule p{margin:2px 0;color:var(--muted)}
.hit{border-color:var(--brand);background:var(--brand-soft)}.hit p{color:var(--text)}
del{color:var(--bad)}ins{color:var(--ok);text-decoration:none}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,380px)}dialog::backdrop{background:rgba(0,0,0,.55)}
.cam{aspect-ratio:1;background:#1c2421;border-radius:12px;display:grid;place-items:center;position:relative}
.cam .frame{position:absolute;inset:20%;border:3px solid #fff;border-radius:12px}
.cam svg{width:42%;opacity:.9}
.scanbtns{display:grid;gap:6px;margin-top:10px}
.scanst{font-weight:700;min-height:1.5em;margin:8px 0 0}
/* 公車：即時到站卡片、公車頁、到站提醒 */
.bbig{display:flex;align-items:baseline;gap:8px;margin:2px 0 6px}.bbig strong{font-size:28px;font-variant-numeric:tabular-nums;color:var(--brand)}
.bstop{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:4px 6px;font-size:13.5px}
.bstop .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--brand);background:#fff;justify-self:center}
.bstop.me{background:var(--brand-soft);border-radius:8px;font-weight:700}.bstop.past{color:var(--faint)}
.bstop .bus{width:22px;height:22px;color:var(--brand)}.bstop .eta{font-variant-numeric:tabular-nums;color:var(--muted)}
.remind{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rset{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:6px 10px;font-size:13px;margin-top:8px}
.rank{display:grid;gap:4px}.rank div{display:flex;justify-content:space-between;padding:4px 8px;border-radius:8px;background:#f4f6f5}.rank .win{background:var(--brand-soft);color:var(--brand);font-weight:700}
.banner{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:#1f2a28;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;display:flex;gap:10px;align-items:center;animation:in .3s ease both}
.banner small{display:block;color:#b8c7c3}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="top">
  <h1>阿幫 Agent 互動模型（原型）</h1>
  <p>點情境或自己打字。右邊看每一步送出的事件、模型看得到什麼、哪條規則生效。資料是示範片段（2026-11-19），等待只為看清楚順序。</p>
  <div class="bar">
    <div class="seg" role="group" aria-label="回答方式">
      <button type="button" id="m-demo" aria-pressed="true">示範模式（規則式）</button>
      <button type="button" id="m-model" aria-pressed="false">模型模式（Claude／地端）</button>
    </div>
    <button class="ghost" type="button" id="reset">清空對話</button>
    <button class="ghost" type="button" id="speed" aria-pressed="false">時間加速 ×10</button>
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="wrap">
  <section class="phone" aria-label="問阿幫">
    <header><span id="hdr-av"></span><b>問阿幫</b><span class="mode-tag" id="mode-tag">示範模式</span></header>
    <div class="chat" id="chat" aria-live="polite"></div>
    <form class="composer" id="composer">
      <input id="q" placeholder="例如：台積電股價多少" aria-label="問阿幫" autocomplete="off">
      <button class="btn">送出</button>
    </form>
  </section>

  <section class="panel" aria-label="互動模型">
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="events">事件流</button>
      <button role="tab" aria-selected="false" data-tab="sees">模型看得到的</button>
      <button role="tab" aria-selected="false" data-tab="rules">規則</button>
    </div>
    <div class="pane" id="p-events"></div>
    <div class="pane" id="p-sees" hidden></div>
    <div class="pane" id="p-rules" hidden></div>
  </section>
</div>

<dialog id="busdlg" aria-label="公車即時動態">
  <h3 style="margin:0 0 6px">公車 601 即時動態</h3>
  <div id="busdlg-body"></div>
  <button class="btn" type="button" id="busdlg-close" style="width:100%;margin-top:10px">關閉</button>
</dialog>

<dialog id="scan" aria-label="掃描發票 QR code">
  <div class="cam"><div class="frame"></div>
    <svg viewBox="0 0 21 21" aria-hidden="true"><path fill="#fff" d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zm1 1v5h5V1zm1 1h3v3h-3zM0 14h7v7H0zm1 1v5h5v-5zm1 1h3v3H2zM8 0h2v2H8zm3 1h2v3h-2zM8 4h2v4H8zm4 4h3v2h-3zm-4 2h3v3H8zm9 0h2v2h-2zm-4 3h2v2h-2zm3 1h5v2h-5zm-6 2h2v5H8zm4 1h3v4h-3zm6 1h3v3h-3z"/></svg>
  </div>
  <p style="margin:10px 0 0">對準發票<b>左邊</b>的 QR code，可以一張接一張掃。（原型：按下面的按鈕模擬掃到）</p>
  <div class="scanbtns">
    <button class="btn alt sm" type="button" data-code="AB54348835115080312340000006400000069000000001234567800000000000000000000000:**********:1:1:1:咖啡:1:65">模擬：左邊 QR（AB-54348835，8/3）</button>
    <button class="btn alt sm" type="button" data-code="CD12348835115082012340000">模擬：左邊 QR（CD-12348835，8/20）</button>
    <button class="btn alt sm" type="button" data-code="**咖啡:1:65:蛋糕:1:80">模擬：右邊明細 QR</button>
    <button class="btn alt sm" type="button" data-code="11512XY123456780000">模擬：中間一維條碼（11–12 月）</button>
  </div>
  <p class="scanst" id="scanst" role="status">對準 QR code…</p>
  <button class="btn" type="button" id="scan-done" style="width:100%;margin-top:8px">完成</button>
</dialog>

  const ranks = budget ? [['公車 601', 86], ['捷運', 79], ['YouBike', 61], ['叫車（Uber）', 34]] : [['公車 601', 80], ['捷運', 78], ['叫車（Uber）', 62], ['YouBike', 58]];
  const reason = budget ? '選「公車 601」：因為你想省錢，15 元、只要走 3 分。' : '選「公車 601」：比捷運便宜、少走 4 分，時間只差 4 分。';
  ev('decision', json({ best: 'bus-601', states: budget ? [{ key: 'budget', source: 'said' }] : [], reason }));
  add(h('div', { class: 'card' }, h('h3', null, '決策：西門町 → 台北101', h('span', { class: 'badge' }, 'decide.js 計分')), h('div', { class: 'rank' }, ranks.map(([n, sc], i) => h('div', { class: i ? '' : 'win' }, h('span', null, n), h('span', null, sc)))), h('p', { class: 'foot' }, reason)));
  // 新行為：選了公車 → 自動盯上車站的即時到站
  await step('公車', `@公車 你選了公車，我幫你盯 ${BUS.route} 在「${BUS.board}」的到站`, [['bus_route_eta', { city: 'Taipei', routeName: BUS.route, stop: BUS.board }]], [`${BUS.route} 約 ${Math.round(380 / 60)} 分後到${BUS.board}，下一班約 ${Math.round((380 + BUS.headway) / 60)} 分。`]);
  const box = h('div', { class: 'card', 'data-card': 'bus-route' });
  add(box);
  busView(box, false);
  startBus();
  return say(`${reason}${BUS.route} 大約 ${Math.round(bus.eta / 60)} 分後到「${BUS.board}」，走過去 ${BUS.walk} 分，現在出門剛好。要我在公車快到站時提醒你嗎？可以按卡片上的「到站前 3 分提醒我」。`);
}

// ── 掃發票（原型：按鈕模擬掃到；正式版用 BarcodeDetector＋相機）──
function parseCode(s) {
  if (s.startsWith('**')) return { side: 'right' };
  let m = /^([A-Z]{2})(\d{8})(\d{3})(\d{2})(\d{2})\d{4}/.exec(s);
  if (m) return { track: m[1], number: m[2], date: `${Number(m[3]) + 1911}-${m[4]}-${m[5]}` };
  m = /^(\d{3})(\d{2})([A-Z]{2})(\d{8})\d{4}$/.exec(s);
  if (m) return { track: m[3], number: m[4], period: `${m[1]}${String(Number(m[2]) - 1).padStart(2, '0')}` };
  return null;
}
let scanned = 0;
const seen = new Set();
function openScan() {
  scanned = 0; seen.clear();
  $('#scanst').textContent = '對準 QR code…';
  ev('client', '開相機（getUserMedia，影像不上傳）', 'client');
  $('#scan').showModal();
}
document.querySelectorAll('#scan [data-code]').forEach((b) => b.addEventListener('click', () => {
  const raw = b.dataset.code;
  const st = $('#scanst');
  if (seen.has(raw)) { st.textContent = '同一張已經掃過了'; return; }
  seen.add(raw);
  const c = parseCode(raw);
  if (!c) { st.textContent = '這不是發票的條碼'; return; }
  if (c.side === 'right') { st.textContent = '這是右邊的明細 QR code，請掃左邊那個'; return; }
  if (wallet.some((x) => x.number === c.number)) { st.textContent = `${c.track}-${c.number}：這張已經存過了`; return; }
  wallet.unshift({ ...c });
  scanned++;
  st.textContent = `已存 ${c.track}-${c.number}（這次已存 ${scanned} 張）`;
  ev('client', `BarcodeDetector → ${JSON.stringify(c)}（只取號碼與日期）`, 'client');
  drawWallet(); drawSees(lastBody);
}));
$('#scan-done').addEventListener('click', async () => {
  $('#scan').close();
  ev('client', '停相機', 'client');
  if (!scanned) return;
  const items = wallet.filter((x) => !x.status);
  ev('host.callTool', json({ name: 'invoice_check_batch', args: { items: items.map(({ number, date, period }) => ({ number, ...(date ? { date } : { period }) })) } }), 'client');
  await wait(300);
  for (const x of items) {
    const p = x.period || `${Number(x.date.slice(0, 4)) - 1911}${String(Number(x.date.slice(5, 7)) % 2 ? Number(x.date.slice(5, 7)) : Number(x.date.slice(5, 7)) - 1).padStart(2, '0')}`;
    if (p === INVOICE.period) Object.assign(x, checkInvoice(x.number), { status: checkInvoice(x.number).prize ? 'won' : 'lost' });
    else x.status = 'pending';
  }
  drawWallet(); drawSees(lastBody);
  const won = items.filter((x) => x.status === 'won');
  add(h('div', { class: 'sys' }, won.length ? `🎉 中獎了！${won.map((w) => `${w.number} ${w.prize}`).join('、')}` : `已對獎 ${items.length} 張`));
});
$('#scan').addEventListener('cancel', () => ev('client', '停相機', 'client'));
