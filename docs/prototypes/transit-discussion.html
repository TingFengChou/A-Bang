<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿幫・生活｜工具討論串原型</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--text:#14201d;--muted:#5f6f6b;--faint:#97a5a1;--line:#e3e8e6;
  --brand:#0f766e;--brand-soft:#e3f2ef;--bus:#0f766e;--bus-soft:#e3f2ef;--bike:#b45309;--bike-soft:#fdf1e3;
  --rail:#c2410c;--rail-soft:#fdeee7;--walk:#57534e;--walk-soft:#f1efe8;--place:#1d4ed8;--place-soft:#e6f1fb;
  --fare:#7c3aed;--fare-soft:#efeafe;--car:#475569;--car-soft:#eef2f6;--tra:#9a3412;--bad-soft:#fde8e8;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.app{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);z-index:2}
header .av{width:38px;height:38px}
header b{font-size:17px}header small{display:block;color:var(--muted);font-size:12px}
.thread{flex:1;padding:4px 14px 12px;display:flex;flex-direction:column;gap:10px}
.u{align-self:flex-end;background:var(--brand);color:#fff;padding:9px 13px;border-radius:16px 16px 4px 16px;max-width:85%}
.row{display:flex;gap:8px;align-items:flex-start;animation:in .3s ease both}
.row .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center}
.row .av svg{width:18px;height:18px}
.row.agent .av{background:none}.row.agent .av svg{width:30px;height:30px}
.who{font-size:12px;color:var(--muted);margin-bottom:2px}
.who .src{color:var(--faint)}
.msg{background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:4px 14px 14px 14px;font-size:14.5px;max-width:300px}
.row.agent .msg{background:var(--brand-soft);border-color:transparent}
.at{font-weight:700;border-radius:6px;padding:0 4px}
.typing{display:inline-flex;gap:3px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.meeting{border:1px dashed var(--line);border-radius:14px;padding:10px 10px 4px;display:flex;flex-direction:column;gap:9px;background:color-mix(in srgb,var(--card) 50%,transparent)}
.meeting>summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.meeting[open]>summary{margin-bottom:2px}
.thread{perspective:900px}
.result{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(16,40,34,.06),0 10px 24px rgba(16,40,34,.08);animation:in3d .55s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
.result h4{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:600}
.best{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.best b{font-size:20px}
.best .min{font-size:26px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.legs{display:flex;gap:4px;margin:10px 0 6px;height:8px}
.legs i{border-radius:4px;transform-origin:left;animation:grow .6s ease both}
.legnote{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:6px;flex-wrap:wrap}
.alts{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.alts div{display:flex;justify-content:space-between;color:var(--muted)}
.cd{font-variant-numeric:tabular-nums;font-weight:700;color:var(--bad)}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1;font:inherit;font-size:14px;padding:9px;border-radius:12px;border:0;cursor:pointer}
.actions .p{background:var(--brand);color:#fff}.actions .s{background:var(--brand-soft);color:var(--brand)}
.actions .btn{flex:1;text-align:center;text-decoration:none;font-size:14px;padding:9px;border-radius:12px}
.track{position:relative;height:46px;margin:12px 4px 4px}
.track .ln{position:absolute;left:0;right:0;top:20px;height:4px;background:var(--line);border-radius:2px}
.track .st{position:absolute;top:15px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--bus);transform:translateX(-50%)}
.track .st.me{border-color:var(--bad);box-shadow:0 0 0 4px #fde8e8}
.track .bus{position:absolute;top:8px;width:28px;height:28px;border-radius:50%;background:var(--bus);display:grid;place-items:center;transform:translateX(-50%);transition:left 1s linear}
.track .bus svg{width:16px;height:16px;color:#fff}
.track .lb{position:absolute;top:34px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.final{animation:in .3s ease both}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 16px;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line)}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--text)}
.chips button.on{border-color:var(--brand);color:var(--brand)}
.note{font-size:11.5px;color:var(--faint);text-align:center;padding:2px 0 6px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--text);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;animation:in .2s ease both;max-width:90vw}
.decide{background:var(--card);border-radius:16px;padding:12px 14px;border:1px solid var(--line);animation:in .35s ease both}
.dsub{font-size:12px;color:var(--muted);margin:-4px 0 8px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.dh span{font-size:12px;color:var(--muted)}
.states{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.states button{font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:4px 10px;cursor:pointer}
.states button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.states button small{opacity:.85;margin-left:2px}
.states .fixed{font-size:12.5px;border-radius:999px;padding:4px 10px;background:var(--rail-soft);color:var(--rail)}
.clegend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-bottom:6px}
.clegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:0}
.dopts{display:flex;flex-direction:column;gap:6px;perspective:700px}
.dopt{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1px solid transparent;transition:background .3s,border-color .3s}
.dopt .dn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbar{display:flex;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.dbar i{display:block;height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ds{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.dopt.win{background:var(--brand-soft);border-color:var(--brand);transform:translateZ(18px);box-shadow:0 6px 14px rgba(15,118,110,.15)}
.dopt{transition:background .3s,border-color .3s,transform .35s,box-shadow .35s}.dopt.win .ds{color:var(--brand)}
.dopt.win .dn::after{content:"最佳";margin-left:6px;font-size:10.5px;background:var(--brand);color:#fff;border-radius:6px;padding:0 5px;vertical-align:1px}
.dopt.out{opacity:.45}.dopt.out .dn{text-decoration:line-through}.dopt.out .ds{font-size:11px;color:var(--bad)}
.dwhy{font-size:13.5px;margin-top:8px;color:var(--text);min-height:20px}
.dgraph{width:100%;height:auto;display:block;margin:2px 0 6px;overflow:visible}
.dgraph .ge{fill:none;stroke:#cfd8d5;stroke-width:1.5;transition:stroke .4s,opacity .4s,stroke-width .5s cubic-bezier(.2,.8,.2,1)}
.dgraph .ge.live{stroke:#9fbdb6}
.dgraph .ge.why{stroke:#0f766e;stroke-width:2.5}
.dgraph .go{stroke:#9fbdb6}
.dgraph .go.win{stroke:#0f766e}
.dgraph .go.dead{stroke:#f3b4b4;stroke-dasharray:3 4}
.dgraph .gl{font-size:10px;fill:var(--muted)}
.dgraph .gn{transition:opacity .4s}
.dgraph .gn.src.pulse circle{animation:gpulse .8s ease}
.dgraph .gn.src.why circle{stroke-width:3}
.dgraph .gcenter.bump{animation:bump .35s ease}
.dgraph .gcenter{transform-box:fill-box;transform-origin:center}
.dgraph .or{fill:#fff;stroke:#cfd8d5;stroke-width:1.2;transition:fill .4s,stroke .4s}
.dgraph .on{font-size:12px;font-weight:600;fill:var(--text)}
.dgraph .os{font-size:12px;font-weight:800;fill:var(--muted)}
.dgraph .opt.win .or{fill:#0f766e;stroke:#0f766e;filter:drop-shadow(0 4px 8px rgba(15,118,110,.35))}
.dgraph .opt.win .on,.dgraph .opt.win .os{fill:#fff}
.dgraph .opt.out .on{text-decoration:line-through;fill:var(--faint)}
.dgraph .opt.out .os{fill:var(--bad);font-size:10px}
.dgraph .pk text{font-size:10.5px;font-weight:700;fill:#fff}
.dgraph .gs rect{fill:#fff;stroke:#0f766e;stroke-width:1}
.dgraph .gs text{font-size:10.5px;fill:#0f766e;font-weight:700}
.dgraph .gs .tg{fill:var(--muted);font-weight:400;font-size:9.5px}
.dgraph .glink{fill:none;stroke:#0f766e;stroke-width:1;stroke-dasharray:2 3;opacity:.7}
.dgraph .flow{fill:#0f766e}
.more{margin-top:6px}.more>summary{cursor:pointer;font-size:12.5px;color:var(--muted);list-style:none}.more[open]>summary{margin-bottom:6px}
@keyframes gpulse{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.08)}}
.dgraph circle{transform-box:fill-box;transform-origin:center}
@keyframes in3d{from{opacity:0;transform:rotateX(-18deg) translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dot{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// 決策引擎：依使用者狀態，替交通方案排序並說明理由（ADR-0010）
// 純函式、規則透明、可測試；不經模型。模型只負責「判斷使用者狀態」與「用口語轉述結果」。
// 前端與 MCP Apps 卡片可以直接用 breakdown 畫出決策過程。

/** 比較項目（都是越小越好）。
 *  ratio：以「最佳值 / 本方案」比例計分（加 k 避免 0），不會被極端值（例如很貴的叫車）壓扁差距
 *  abs：本身是 0–1 的程度值，直接以 1 - 值 計分 */
const CRITERIA = [
  { key: 'minutes', label: '總時間', base: 0.40, scale: 'ratio', k: 5 },
  { key: 'waitMin', label: '等車', base: 0.10, scale: 'ratio', k: 5 },
  { key: 'walkMin', label: '走路', base: 0.15, scale: 'ratio', k: 5 },
  { key: 'cost', label: '費用', base: 0.15, scale: 'ratio', k: 20 },
  { key: 'exposure', label: '淋雨', base: 0.10, scale: 'abs' }, // 0 = 全程室內／有遮蔽，1 = 全程戶外
  { key: 'effort', label: '體力', base: 0.10, scale: 'abs' }, // 0 = 輕鬆，1 = 費力（騎車、長距離步行）
  { key: 'delayRisk', label: '塞車風險', base: 0.05, scale: 'abs' }, // 0 = 軌道／專用道，1 = 走一般道路且路況差
];

/** 使用者狀態：顯示名稱與對權重的影響（倍數） */
const STATES = {
  rush: { label: '趕時間', say: '你趕時間', boost: { minutes: 2, waitMin: 1.5, delayRisk: 2 } },
  traffic: { label: '塞車中', say: '路上正在塞車', boost: { delayRisk: 6, minutes: 1.2 } },
  rain: { label: '下雨', say: '正在下雨', boost: { exposure: 4, walkMin: 1.5 } },
  luggage: { label: '帶行李', say: '你帶著行李', boost: { effort: 4 } },
  budget: { label: '想省錢', say: '你想省錢', boost: { cost: 3 } },
  lessWalk: { label: '少走路', say: '你想少走路、輕鬆一點', boost: { walkMin: 1.5, effort: 3 } },
};

/**
 * @param {Array<{ id: string, name: string, minutes: number, waitMin?: number, walkMin?: number, cost?: number,
 *                 exposure?: number, effort?: number, arriveAt?: string }>} options
 * @param {{ states?: string[], arriveBy?: string }} [ctx]  states 例如 ['rain','luggage']；arriveBy 例如 '08:00'
 * @returns {{ weights: Record<string, number>, ranked: Array<object>, excluded: Array<object>, best: object|null, reason: string }}
 */
function decide(options, ctx = {}) {
  const states = (ctx.states || []).filter((s) => STATES[s]);

  // 1. 權重：基本權重 × 狀態倍數，再正規化成總和 1
  const raw = Object.fromEntries(CRITERIA.map((c) => [c.key, c.base]));
  for (const s of states) for (const [k, m] of Object.entries(STATES[s].boost)) raw[k] *= m;
  const sum = Object.values(raw).reduce((a, b) => a + b, 0);
  const weights = Object.fromEntries(Object.entries(raw).map(([k, v]) => [k, v / sum]));

  // 2. 硬限制：指定抵達時間時，會遲到的方案直接排除
  const excluded = [];
  const pool = options.filter((o) => {
    if (ctx.arriveBy && o.arriveAt && o.arriveAt > ctx.arriveBy) {
      excluded.push({ ...o, why: `${o.arriveAt} 才到，超過 ${ctx.arriveBy}` });
      return false;
    }
    return true;
  });

  // 3. 各項正規化（越小越好 → 分數越高），乘上權重
  const val = (o, k) => Number(o[k] ?? 0);
  const ranked = pool.map((o) => {
    const breakdown = {};
    for (const c of CRITERIA) {
      let norm;
      if (c.scale === 'abs') norm = 1 - Math.min(1, Math.max(0, val(o, c.key)));
      else { const lo = Math.min(...pool.map((p) => val(p, c.key))); norm = (lo + c.k) / (val(o, c.key) + c.k); }
      breakdown[c.key] = norm * weights[c.key];
    }
    const score = Object.values(breakdown).reduce((a, b) => a + b, 0);
    return { ...o, score: Math.round(score * 100), breakdown };
  }).sort((a, b) => b.score - a.score || a.minutes - b.minutes);

  const best = ranked[0] || null;
  return { weights, ranked, excluded, best, reason: explain(best, ranked[1], states, excluded) };
}

/** 產生一句理由：最佳方案贏在哪裡（取貢獻差最大的項目）＋生效的狀態 */
function explain(best, second, states, excluded) {
  if (!best) return excluded.length ? '所有方案都趕不上指定時間。' : '沒有可比較的方案。';
  const why = [];
  if (states.length) why.push(`因為${states.map((s) => STATES[s].say).join('、')}`);
  if (second) {
    const diffs = CRITERIA.map((c) => ({ c, d: best.breakdown[c.key] - second.breakdown[c.key] })).sort((a, b) => b.d - a.d);
    const top = diffs.filter((x) => x.d > 0.01).slice(0, 2).map((x) => PHRASE[x.c.key](best, second));
    if (top.length) why.push(top.join('、'));
  }
  if (excluded.length) why.push(`${excluded.map((e) => e.name).join('、')}會遲到已排除`);
  return `選「${best.name}」${why.length ? '：' + why.join('，') : ''}。`;
}

const svgEl = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent?.appendChild(e); return e; };
const nestIcon = (role, x, y, size, color) => ICON[role].replace('<svg ', `<svg x="${x}" y="${y}" width="${size}" height="${size}" style="color:${color}" `);
const roleColor = (r) => getComputedStyle(document.documentElement).getPropertyValue(`--${ROLE[r].c}`).trim() || '#0f766e';

function buildGraph(panel, s) {
  const svg = panel.querySelector('#dGraph');
  const srcs = [...new Set(s.lines.filter(([w]) => w !== 'agent').map(([w]) => w))];
  const W = 360, H = Math.max(250, Math.max(srcs.length, s.options.length) * 46 + 30), C = { x: 176, y: H / 2 };
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const ys = (n, i) => (n === 1 ? H / 2 : 26 + (i * (H - 52)) / (n - 1));
  const g = { svg, C, src: {}, opt: {}, W, H };
  const eL = svgEl('g', { class: 'edges' }, svg), nL = svgEl('g', {}, svg);
  g.pkt = svgEl('g', {}, svg);
  srcs.forEach((r, i) => {
    const y = ys(srcs.length, i), x = 34, col = roleColor(r);
    const d = `M${x + 16} ${y} C ${x + 70} ${y}, ${C.x - 80} ${C.y}, ${C.x - 30} ${C.y}`;
    const edge = svgEl('path', { d, class: 'ge' }, eL);
    const node = svgEl('g', { class: 'gn src', opacity: .35 }, nL);
    svgEl('circle', { cx: x, cy: y, r: 16, fill: `var(--${ROLE[r].c}-soft)`, stroke: col, 'stroke-width': 1.5 }, node);
    node.insertAdjacentHTML('beforeend', nestIcon(r, x - 9, y - 9, 18, col) + `<text x="${x}" y="${y + 28}" text-anchor="middle" class="gl">${ROLE[r].name}</text>`);
    g.src[r] = { node, edge, d, x, y, col };
  });
  const cg = svgEl('g', { class: 'gcenter' }, nL);
  svgEl('circle', { cx: C.x, cy: C.y, r: 30, fill: '#fff', stroke: '#0f766e', 'stroke-width': 2, class: 'ring' }, cg);
  cg.insertAdjacentHTML('beforeend', MASCOT.think.replace('<svg ', `<svg x="${C.x - 27}" y="${C.y - 29}" width="54" height="54" `));
  g.center = cg;
  g.states = svgEl('g', {}, nL);
  s.options.forEach((o, i) => {
    const y = ys(s.options.length, i), x = 252;
    const d = `M${C.x + 30} ${C.y} C ${C.x + 60} ${C.y}, ${x - 40} ${y}, ${x} ${y}`;
    const edge = svgEl('path', { d, class: 'ge go', style: 'stroke-width:0' }, eL);
    const node = svgEl('g', { class: 'gn opt', opacity: .25 }, nL);
    svgEl('rect', { x: x - 6, y: y - 15, width: 112, height: 30, rx: 15, class: 'or' }, node);
    svgEl('text', { x: x + 6, y: y + 4, class: 'on' }, node).textContent = o.name.length > 7 ? o.name.slice(0, 6) + '…' : o.name;
    svgEl('text', { x: x + 98, y: y + 4, 'text-anchor': 'end', class: 'os' }, node).textContent = '';
    g.opt[o.id] = { node, edge, d, x, y };
  });
  return g;
}

function packet(g, from, label, to = null) {
  const s = g.src[from]; if (!s) return Promise.resolve();
  const p = svgEl('g', { class: 'pk' }, g.pkt);
  const w = Math.max(28, label.length * 11 + 12);
  svgEl('rect', { x: -w / 2, y: -10, width: w, height: 20, rx: 10, fill: s.col }, p);
  svgEl('text', { x: 0, y: 4, 'text-anchor': 'middle' }, p).textContent = label;
  const m = svgEl('animateMotion', { dur: RM ? '0.01s' : '0.8s', fill: 'freeze', path: to || s.d, calcMode: 'spline', keyTimes: '0;1', keySplines: '.4 0 .2 1' }, p);
  m.beginElement();
  return new Promise((res) => setTimeout(() => { p.remove(); res(); }, RM ? 0 : 820));
}

async function collect(g, s, my) {
  for (const [r, label] of Object.entries(s.packets)) {
    if (my !== RUN) return;
    const n = g.src[r]; if (!n) continue;
    n.node.setAttribute('opacity', 1); n.node.classList.add('pulse'); n.edge.classList.add('live');
    await packet(g, r, label);
    n.node.classList.remove('pulse');
    g.center.classList.remove('bump'); void g.center.getBBox(); g.center.classList.add('bump');
  }
}

function drawStates(g, s, st) {
  g.states.innerHTML = '';
  const list = [...[...st].map((k) => ({ k, label: STATES[k].label, from: s.stateSrc?.[k] ? (s.stateFrom?.[k] || null) : null, tag: s.stateSrc?.[k] ? '自動' : '你選' })),
    ...(s.arriveBy ? [{ k: 'arrive', label: `${s.arriveBy} 前到`, tag: '你說的' }] : [])];
  list.forEach((it, i) => {
    const y = g.C.y - 50 - i * 22, x = g.C.x;
    const t = svgEl('g', { class: 'gs' }, g.states);
    const w = it.label.length * 12 + it.tag.length * 10 + 22;
    svgEl('rect', { x: x - w / 2, y: y - 10, width: w, height: 20, rx: 10 }, t);
    svgEl('text', { x, y: y + 4, 'text-anchor': 'middle' }, t).innerHTML = `${it.label}<tspan dx="4" class="tg">${it.tag}</tspan>`;
    if (it.from && g.src[it.from]) { const f = g.src[it.from]; svgEl('path', { d: `M${f.x + 16} ${f.y} Q ${x - 60} ${y} ${x - w / 2} ${y}`, class: 'glink' }, g.states); }
  });
}

function evaluate(g, r, frac = 1) {
  for (const o of r.ranked) {
    const n = g.opt[o.id]; n.node.setAttribute('opacity', 1); n.node.classList.remove('out', 'win');
    n.edge.style.strokeWidth = (1 + (o.score / 100) * 7 * frac).toFixed(1); n.edge.classList.remove('dead', 'win');
    n.node.querySelector('.os').textContent = frac >= 1 ? o.score : '';
  }
  for (const o of r.excluded) { const n = g.opt[o.id]; n.node.setAttribute('opacity', 1); n.node.classList.add('out'); n.edge.style.strokeWidth = 1; n.edge.classList.add('dead'); n.node.querySelector('.os').textContent = '遲到'; }
}

function conclude(g, r) {
  evaluate(g, r, 1);
  Object.values(g.src).forEach((n) => { n.edge.classList.remove('why'); n.node.classList.remove('why'); });
  g.svg.querySelectorAll('.flow').forEach((e) => e.remove());
  if (!r.best) return;
  const b = g.opt[r.best.id]; b.node.classList.add('win'); b.edge.classList.add('win');
  for (const o of r.ranked.slice(1)) g.opt[o.id].node.setAttribute('opacity', .55);
  // 理由路徑：贏在哪些項目 → 對應的資料來源亮起
  const second = r.ranked[1];
  const keys = second ? CRITERIA.map((c) => ({ k: c.key, d: r.best.breakdown[c.key] - second.breakdown[c.key] })).filter((x) => x.d > 0.01).sort((a, b) => b.d - a.d).slice(0, 2).map((x) => x.k) : ['minutes'];
  const roles = new Set([r.best.role, ...keys.flatMap((k) => CRIT_SRC[k] || [])]);
  for (const role of roles) { const n = g.src[role]; if (n) { n.edge.classList.add('why'); n.node.classList.add('why'); } }
  // 勝出路徑上持續流動的小光點
  if (!RM) for (let i = 0; i < 3; i++) { const dot = svgEl('circle', { r: 3, class: 'flow' }, g.pkt); svgEl('animateMotion', { dur: '1.6s', begin: `${i * 0.53}s`, repeatCount: 'indefinite', path: b.d }, dot).beginElement?.(); }
}

/* ---- 決策過程：逐項比較 → 排名 → 理由；切換狀態即時重算 ---- */
function decisionPanel(s) {
  const el = add(`<div class="dh"><b>阿幫在比較</b><span id="dStep">準備中…</span></div>
    <div class="dsub">小幫手查到的資料 → 加上你的狀況 → 比較每個方案</div>
    <svg id="dGraph" class="dgraph" role="img" aria-label="決策過程圖"></svg>
    <div class="states" id="dStates">${Object.entries(STATES).map(([k, v]) => `<button data-k="${k}" class="${s.states.includes(k) ? 'on' : ''}">${v.label}${s.stateSrc?.[k] ? `<small>・自動：${s.stateSrc[k]}</small>` : ''}</button>`).join('')}${s.arriveBy ? `<span class="fixed">${s.arriveBy} 前到（你說的）</span>` : ''}</div>
    <div class="dwhy" id="dWhy"></div>
    <details class="more"><summary>看比較細節</summary>
    <div class="clegend">${CRITERIA.map((c) => `<span><i style="background:${CCOLOR[c.key]}"></i>${c.label}</span>`).join('')}</div>
    <div class="dopts" id="dOpts">${s.options.map((o) => `<div class="dopt" data-id="${o.id}"><span class="dn">${o.name}</span><span class="dbar">${CRITERIA.map((c) => `<i data-c="${c.key}" style="background:${CCOLOR[c.key]};width:0"></i>`).join('')}</span><span class="ds">–</span></div>`).join('')}</div>
    </details>`, 'decide');
  return el;
}
function paintDecision(panel, r, upto = CRITERIA.length) {
  const rows = [...panel.querySelectorAll('.dopt')];
  const first = new Map(rows.map((x) => [x.dataset.id, x.getBoundingClientRect().top]));
  const order = [...r.ranked.map((o) => o.id), ...r.excluded.map((o) => o.id)];
  const box = panel.querySelector('#dOpts');
  for (const o of r.ranked) {
    const row = box.querySelector(`[data-id="${o.id}"]`); row.classList.remove('out', 'win');
    CRITERIA.forEach((c, i) => (row.querySelector(`[data-c="${c.key}"]`).style.width = i < upto ? (o.breakdown[c.key] * 100).toFixed(1) + '%' : '0'));
    row.querySelector('.ds').textContent = upto >= CRITERIA.length ? o.score : '…';
  }
  for (const o of r.excluded) { const row = box.querySelector(`[data-id="${o.id}"]`); row.classList.add('out'); row.querySelectorAll('i').forEach((i) => (i.style.width = '0')); row.querySelector('.ds').textContent = '會遲到'; }
  if (upto < CRITERIA.length) return;
  order.forEach((id) => box.appendChild(box.querySelector(`[data-id="${id}"]`)));
  for (const row of box.children) { const d = first.get(row.dataset.id) - row.getBoundingClientRect().top; if (d && !RM) row.animate([{ transform: `translateY(${d}px) rotateX(${d > 0 ? -35 : 35}deg)` }, { transform: 'translateY(0) rotateX(0)' }], { duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)' }); }
  if (r.best) box.querySelector(`[data-id="${r.best.id}"]`).classList.add('win');
  panel.querySelector('#dWhy').innerHTML = r.reason.replace(/「(.+?)」/, '「<b>$1</b>」');
  panel.querySelector('#dStep').textContent = '依你的狀況排序';
}
function resultCard(s, r) {
  const b = r.best, alts = [...r.ranked.slice(1).map((o) => `<div><span>${o.name}</span><span>${o.minutes} 分</span></div>`), ...r.excluded.map((o) => `<div><span>${o.name}</span><span>${o.arriveAt} 到，會遲到</span></div>`)].join('');
  return `<h4>阿幫建議</h4><div class="best"><b>${b.name}</b><span class="min">${b.minutes} 分</span></div>${legBar(b.legs)}<div class="alts">${alts}</div><div class="actions">${b.actions()}</div>`;
}

async function play(k) {
  const my = ++RUN; timers.forEach(clearInterval); timers = []; $t.innerHTML = '';
  document.querySelectorAll('#chips button').forEach((b, i) => b.classList.toggle('on', i === k));
  const s = SC[k];
  add(s.q, 'u'); await sleep(400); if (my !== RUN) return;
  const det = document.createElement('details'); det.open = true; det.className = 'meeting'; det.innerHTML = `<summary><span>小幫手討論中…</span><span>收合</span></summary>`; $t.appendChild(det);
  for (const [who, text] of s.lines) { await speak(det, who, text, my); if (my !== RUN) return; }
  const tools = new Set(s.lines.filter(([w]) => w !== 'agent').map(([w]) => ROLE[w].tool));
  const srvs = new Set(s.lines.filter(([w]) => w !== 'agent').map(([w]) => ROLE[w].src.split(' · ')[0]));
  det.querySelector('summary span').textContent = `小幫手討論完成・${tools.size} 個工具・${srvs.size} 個 MCP`;
  await sleep(300); det.open = false;
  const tg = det.querySelector('summary span:last-child'); const upd = () => (tg.textContent = det.open ? '收合' : '看討論過程'); det.addEventListener('toggle', upd); upd();

  let card, finalMsg;
  if (s.options) {
    const st = new Set(s.states);
    const panel = decisionPanel(s);
    const graph = buildGraph(panel, s);
    let r = decide(s.options, { states: [...st], arriveBy: s.arriveBy });
    const step = (t) => (panel.querySelector('#dStep').textContent = t);
    step('① 收集資料'); await collect(graph, s, my); if (my !== RUN) return;
    step('② 看你的狀況'); drawStates(graph, s, st); await sleep(700); if (my !== RUN) return;
    for (let i = 1; i <= CRITERIA.length; i++) { step(`③ 比較：${CRITERIA[i - 1].label}`); evaluate(graph, r, i / CRITERIA.length); paintDecision(panel, r, i); await sleep(300); if (my !== RUN) return; }
    step('④ 決定'); paintDecision(panel, r); conclude(graph, r); graph.center.innerHTML = graph.center.innerHTML.replace(/aria-label="阿幫（查詢中）"/, ''); 
    panel.querySelectorAll('#dStates button').forEach((btn) => (btn.onclick = () => {
      st.has(btn.dataset.k) ? st.delete(btn.dataset.k) : st.add(btn.dataset.k); btn.classList.toggle('on');
      const prev = r.best?.id; r = decide(s.options, { states: [...st], arriveBy: s.arriveBy }); paintDecision(panel, r); drawStates(graph, s, st); conclude(graph, r);
      if (!card) return; card.innerHTML = resultCard(s, r); bindActions(card); if (!RM) card.animate([{ boxShadow: '0 0 0 3px #99f6e4' }, { boxShadow: '0 0 0 0 transparent' }], { duration: 700 });
      const on = st.has(btn.dataset.k); if (finalMsg) finalMsg.querySelector('.msg').textContent = (r.best.id !== prev ? (on ? `考慮到${STATES[btn.dataset.k].say}，改成${r.best.name}。` : `不考慮「${STATES[btn.dataset.k].label}」的話，改成${r.best.name}。`) : '') + r.best.say;
    }));
    await sleep(700); if (my !== RUN) return;
    card = add(resultCard(s, r), 'result'); bindActions(card);
    await sleep(400);
    finalMsg = add(`<span class="av">${MASCOT.happy}</span><div><div class="who">阿幫</div><div class="msg">${r.best.say}</div></div>`, 'row agent final');
  } else {
    card = add(s.result(), 'result'); bindActions(card); s.after?.(card);
    await sleep(500); if (my !== RUN) return;
    add(`<span class="av">${MASCOT.happy}</span><div><div class="who">阿幫</div><div class="msg">${s.final}</div></div>`, 'row agent final');
  }
}
function bindActions(card) { card.querySelectorAll('button[data-t]').forEach((b) => (b.onclick = () => toast(b.dataset.t))); }
SC.forEach((s, i) => { const b = document.createElement('button'); b.textContent = s.label; b.onclick = () => play(i); document.getElementById('chips').appendChild(b); });
play(0);
</script>

</body>
